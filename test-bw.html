<!DOCTYPE html>
<html>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
window.onload = () => {
  const { jsPDF } = window.jspdf;
  const canvas = document.createElement('canvas');
  canvas.width = 1200; canvas.height = 1600;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'white'; ctx.fillRect(0,0,1200,1600);
  ctx.fillStyle = 'black'; ctx.font = '16px Arial';
  for(let i=0; i<80; i++) ctx.fillText('This is a line of text to test PNG compressability when it is B&W ' + i, 50, 50 + i*18);

  const imgData = ctx.getImageData(0,0,1200,1600);
  const data = imgData.data;
  // B&W threshold
  for(let i=0; i<data.length; i+=4) {
    const avg = (data[i] + data[i+1] + data[i+2]) / 3;
    const val = avg < 200 ? 0 : 255;
    data[i] = data[i+1] = data[i+2] = val;
  }
  ctx.putImageData(imgData, 0, 0);

  const pngData = canvas.toDataURL('image/png');
  const pdf = new jsPDF();
  pdf.addImage(pngData, 'PNG', 0, 0, 210, 297, undefined, 'FAST');
  const size = pdf.output('arraybuffer').byteLength;
  console.log("PDF Size:", size);
  document.body.innerHTML = "<h1>PDF Size: " + size + "</h1>";
}
</script>
</body>
</html>
