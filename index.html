<html lang="en">

    <meta charset="UTF-8" />

    <title>RS Bhandari Document Generator</title>

    <meta property="og:title" content="RS Bhandari Document Generator" />
    <meta property="og:description" content="An application built with Google AI Studio." />

    <meta name="twitter:card" content="summary_large_image" />
  
<script>
  window.onerror = function(msg, url, lineNo, columnNo, error) {
    fetch('http://localhost:3001', { method: 'POST', body: 'ERROR: ' + msg + ' ' + error?.stack });
    return false;
  };
  const origLog = console.log;
  console.log = function(...args) {
    fetch('http://localhost:3001', { method: 'POST', body: 'LOG: ' + args.join(' ') });
    origLog.apply(console, args);
  };
  const origError = console.error;
  console.error = function(...args) {
    fetch('http://localhost:3001', { method: 'POST', body: 'CONSOLE ERROR: ' + args.join(' ') });
    origError.apply(console, args);
  };
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
